name: Monitor Astra e novos modelos OpenAI

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "openai_monitor.py"
      - ".openai-monitor/**"
      - ".github/workflows/openai-model-monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: openai-model-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ALERT_ASSIGNEE: andradergabriel
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      REQUEST_TIMEOUT: "12"
      MAX_ALERTS_PER_RUN: "4"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor-requirements.txt

      - name: Instalar dependências leves
        run: python -m pip install --disable-pip-version-check -r monitor-requirements.txt

      - name: Verificar fontes e alertar somente quando necessário
        run: python openai_monitor.py

      - name: Persistir estado antirrepetição
        if: always()
        shell: bash
        run: |
          if [[ ! -f .openai-monitor-state.json ]]; then
            echo "Nenhum estado foi produzido."
            exit 0
          fi
          if git diff --quiet -- .openai-monitor-state.json && \
             git diff --cached --quiet -- .openai-monitor-state.json; then
            echo "Estado sem alterações."
            exit 0
          fi
          git config user.name "OpenAI Model Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .openai-monitor-state.json
          git commit -m "chore: atualizar estado do monitor OpenAI [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push concorrente; tentando rebase ($attempt/3)."
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            sleep $((attempt * 2))
          done
          echo "Não foi possível persistir o estado após 3 tentativas."
          exit 1
